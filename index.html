<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山西古建7日游 · 专属导览</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary: #8B4513;
            --primary-light: #A0522D;
            --primary-dark: #6B3410;
            --accent: #D4A574;
            --bg: #FDF8F0;
            --bg-card: #FFFFFF;
            --text: #2C1810;
            --text-secondary: #6B5744;
            --text-light: #9C8B7A;
            --border: #E8DDD0;
            --shadow: rgba(44, 24, 16, 0.08);
            --shadow-strong: rgba(44, 24, 16, 0.15);
            --success: #2D8B4E;
            --warning: #D4A017;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(107, 52, 16, 0.3);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header h1 span {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.85;
            display: block;
            margin-top: 2px;
            letter-spacing: 2px;
        }

        .location-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }

        .location-btn:hover { background: rgba(255,255,255,0.25); }
        .location-btn svg { width: 16px; height: 16px; }
        .location-btn.locating { animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Day Navigation */
        .day-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 0 16px;
            margin-top: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .day-nav::-webkit-scrollbar { display: none; }

        .day-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .day-btn.active {
            background: white;
            color: var(--primary);
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background: var(--bg-card);
            margin: 16px 16px 0;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px var(--shadow);
            overflow: hidden;
            position: sticky;
            top: 88px;
            z-index: 90;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tab-btn svg { width: 22px; height: 22px; }

        .tab-btn.active {
            color: var(--primary);
            background: rgba(139, 69, 19, 0.06);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }

        /* Content Sections */
        .content-section {
            display: none;
            padding: 16px;
            animation: fadeIn 0.3s ease;
        }

        .content-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Map */
        #map {
            width: 100%;
            height: calc(100vh - 240px);
            min-height: 400px;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 2px 12px var(--shadow);
        }

        /* Itinerary Card */
        .itinerary-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .itinerary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .itinerary-header h3 {
            font-size: 18px;
            color: var(--text);
        }

        .itinerary-header .date-badge {
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(139, 69, 19, 0.1);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
        }

        .itinerary-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .itinerary-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .itinerary-meta-item svg { width: 16px; height: 16px; color: var(--primary); }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 28px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 9px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), var(--primary));
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            padding: 12px 0;
            cursor: pointer;
            transition: var(--transition);
        }

        .timeline-item:hover { transform: translateX(4px); }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 18px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 3px solid var(--primary);
            z-index: 1;
        }

        .timeline-item.current::before {
            background: var(--success);
            border-color: var(--success);
            box-shadow: 0 0 0 4px rgba(45, 139, 78, 0.2);
        }

        .timeline-item.completed::before {
            background: var(--text-light);
            border-color: var(--text-light);
        }

        .timeline-time {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline-title .emoji { font-size: 18px; }

        .timeline-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.5;
        }

        .timeline-tags {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .timeline-tag {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(139, 69, 19, 0.08);
            color: var(--primary);
        }

        .timeline-tag.free { background: rgba(45, 139, 78, 0.1); color: var(--success); }
        .timeline-tag.must-see { background: rgba(196, 30, 58, 0.1); color: #C41E3A; }

        /* Spot Detail Card */
        .spot-detail-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .spot-detail-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }

        .spot-detail-header h3 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .spot-detail-header p {
            font-size: 13px;
            opacity: 0.85;
        }

        .spot-detail-body {
            padding: 20px;
        }

        .spot-section {
            margin-bottom: 20px;
        }

        .spot-section h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .spot-section h4 svg { width: 18px; height: 18px; }

        .spot-section p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        /* Statue List */
        .statue-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .statue-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
        }

        .statue-item .emoji {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .statue-item .name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .statue-item .desc {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .info-item .label {
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .info-item .value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        /* Action Buttons */
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(139, 69, 19, 0.3);
        }

        .action-btn svg { width: 18px; height: 18px; }

        .action-btn.secondary {
            background: var(--bg);
            color: var(--primary);
            border: 2px solid var(--border);
        }

        /* Nearby Section */
        .nearby-status {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .nearby-status svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            color: var(--border);
        }

        .nearby-status p { font-size: 14px; margin-bottom: 8px; }

        .nearby-status button {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .nearby-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nearby-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-card);
            padding: 14px;
            border-radius: var(--radius-sm);
            box-shadow: 0 2px 8px var(--shadow);
            cursor: pointer;
            transition: var(--transition);
        }

        .nearby-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px var(--shadow-strong);
        }

        .nearby-item-emoji {
            font-size: 36px;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .nearby-item-info { flex: 1; min-width: 0; }

        .nearby-item-name { font-size: 15px; font-weight: 600; }

        .nearby-item-dist { font-size: 12px; color: var(--text-light); margin-top: 2px; }

        .nearby-item-arrow { color: var(--text-light); flex-shrink: 0; }

        .nearby-item-arrow svg { width: 20px; height: 20px; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 12px auto;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .modal-body { padding: 20px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 300;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            display: flex;
            padding: 8px 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            box-shadow: 0 -2px 20px var(--shadow);
            z-index: 100;
            border-top: 1px solid var(--border);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 0;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: 11px;
            transition: var(--transition);
        }

        .nav-item svg { width: 24px; height: 24px; }
        .nav-item.active { color: var(--primary); }

        /* TTS Button */
        .tts-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            background: var(--bg-card);
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }

        .tts-btn:hover { border-color: var(--primary); color: var(--primary); }
        .tts-btn.playing { border-color: var(--primary); color: var(--primary); background: rgba(139, 69, 19, 0.05); }
        .tts-btn svg { width: 16px; height: 16px; }

        /* Leaflet Custom */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: var(--primary);
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 16px;
        }

        .custom-marker span { transform: rotate(45deg); }

        .leaflet-popup-content-wrapper { border-radius: 12px !important; }
        .leaflet-popup-content { margin: 12px 16px !important; font-family: inherit !important; }

        .popup-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
        .popup-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .popup-btn {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 16px;
            background: var(--primary);
            color: white;
            font-size: 12px;
            cursor: pointer;
            border: none;
        }

        /* Responsive */
        @media (min-width: 768px) {
            body { max-width: 768px; margin: 0 auto; box-shadow: 0 0 40px var(--shadow); }
            .bottom-nav { max-width: 768px; left: 50%; transform: translateX(-50%); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <h1>
                山西古建7日游
                <span>专属导览系统</span>
            </h1>
            <button class="location-btn" id="locationBtn" onclick="getUserLocation()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 11.5 7.3 11.8a1 1 0 0 0 1.4 0C13 21.5 20 15.4 20 10a8 8 0 0 0-8-8z"/></svg>
                <span id="locationText">定位</span>
            </button>
        </div>
        <nav class="day-nav" id="dayNav">
            <button class="day-btn active" onclick="selectDay(1)">D1 大同</button>
            <button class="day-btn" onclick="selectDay(2)">D2 云冈</button>
            <button class="day-btn" onclick="selectDay(3)">D3 悬空寺</button>
            <button class="day-btn" onclick="selectDay(4)">D4 唐代双宝</button>
            <button class="day-btn" onclick="selectDay(5)">D5 双林寺</button>
            <button class="day-btn" onclick="selectDay(6)">D6 小西天</button>
            <button class="day-btn" onclick="selectDay(7)">D7 返程</button>
        </nav>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('itinerary')" data-tab="itinerary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            行程
        </button>
        <button class="tab-btn" onclick="switchTab('spots')" data-tab="spots">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            景点
        </button>
        <button class="tab-btn" onclick="switchTab('map')" data-tab="map">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            地图
        </button>
        <button class="tab-btn" onclick="switchTab('nearby')" data-tab="nearby">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            附近
        </button>
    </nav>

    <!-- Itinerary Section -->
    <section class="content-section active" id="section-itinerary">
        <div id="itineraryContent"></div>
    </section>

    <!-- Spots Section -->
    <section class="content-section" id="section-spots">
        <div id="spotsContent"></div>
    </section>

    <!-- Map Section -->
    <section class="content-section" id="section-map">
        <div id="map"></div>
    </section>

    <!-- Nearby Section -->
    <section class="content-section" id="section-nearby">
        <div class="nearby-status" id="nearbyStatus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <p>开启定位，发现附近景点</p>
            <p style="font-size: 12px;">系统将根据您的位置推荐最近的景点</p>
            <button onclick="getUserLocation()">📍 获取我的位置</button>
        </div>
        <div class="nearby-list" id="nearbyList" style="display:none;"></div>
    </section>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" id="detailModal">
            <div class="modal-handle"></div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== Data =====
        const itinerary = {
            1: {
                title: '抵达大同',
                date: '第一天',
                accommodation: '大同市区',
                transport: '✈️飞机 + 🚄高铁',
                items: [

                    { name: '千佛殿', desc: '千尊小佛龛背景', emoji: '🗿' },
                    { name: '2052尊彩塑', desc: '宋元明清历代', emoji: '👥' }
                ],
                keywords: ['双林', '韦驮', '观音', '彩塑']
            },
            {
                id: 10, name: '镇国寺', emoji: '🛕', lat: 37.25, lng: 112.25,
                subtitle: '五代木构 · 万佛殿',
                era: '五代北汉(963年)', price: '25元', duration: '1小时',
                history: '镇国寺始建于五代北汉天会年间（963-979年），原名京城寺，明代改称镇国寺。万佛殿是中国仅存3座五代木构建筑之一。1997年与平遥古城、双林寺一起入选世界文化遗产。',
                feature: '万佛殿整座大殿没用一根钉子，全靠榫卯结构屹立千年。无柱设计+超大斗拱，教科书级建筑范本。殿内11尊五代原作彩塑，全国独一份，比太原晋祠还早100多年。',
                statues: [
                    { name: '万佛殿', desc: '五代木构，无柱设计', emoji: '🏛️' },
                    { name: '11尊五代彩塑', desc: '全国独一份', emoji: '🗿' }
                ],
                keywords: ['镇国', '五代', '万佛殿', '彩塑']
            },
            {
                id: 11, name: '小西天', emoji: '🏛️', lat: 36.67, lng: 111.00,
                subtitle: '中国悬塑艺术博物馆 · 悬塑绝唱',
                era: '明代(1634年)', price: '35元', duration: '2小时',
                history: '小西天创建于明代崇祯七年（1634年），由东明禅师始建。因《黑神话：悟空》取景而爆红。小西天之前无满堂悬塑，之后无悬塑满堂，堪称"悬塑绝唱"。',
                feature: '大雄宝殿内满堂悬塑，千佛环绕，金碧辉煌。悬塑技术使塑像仿佛悬浮于空中，光影效果极佳，早晨阳光照射进来时最为震撼。与双林寺并称"南北双绝"。',
                statues: [
                    { name: '释迦牟尼', desc: '主佛', emoji: '🧘' },
                    { name: '文殊普贤', desc: '二菩萨', emoji: '🙏' },
                    { name: '满堂悬塑', desc: '千佛环绕', emoji: '✨' },
                    { name: '金碧辉煌', desc: '明代悬塑绝品', emoji: '🌟' }
                ],
                keywords: ['小西天', '悬塑', '明代', '黑神话']
            }
        ];

        // ===== State =====
        let currentDay = 1;
        let currentTab = 'itinerary';
        let userLat = null;
        let userLng = null;
        let map = null;
        let markers = [];
        let currentDetailSpot = null;
        let isSpeaking = false;

        // ===== Initialize =====
        document.addEventListener('DOMContentLoaded', () => {
            renderItinerary();
            renderSpots();
            initMap();
        });

        // ===== Day Selection =====
        function selectDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.day-btn')[day - 1].classList.add('active');
            renderItinerary();
        }

        // ===== Tab Switching =====
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(`section-${tab}`).classList.add('active');

            if (tab === 'map' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        // ===== Render Itinerary =====
        function renderItinerary() {
            const data = itinerary[currentDay];
            const container = document.getElementById('itineraryContent');
            
            let html = `
                <div class="itinerary-card">
                    <div class="itinerary-header">
                        <h3>📅 ${data.title}</h3>
                        <span class="date-badge">${data.date}</span>
                    </div>
                    <div class="itinerary-meta">
                        <div class="itinerary-meta-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            住宿：${data.accommodation}
                        </div>
                        <div class="itinerary-meta-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${data.transport}
                        </div>
                    </div>
                    <div class="timeline">
            `;

            data.items.forEach((item, idx) => {
                const tagHtml = item.tags.map(t => {
                    let cls = 'timeline-tag';
                    if (t === '免费') cls += ' free';
                    if (t === '必看') cls += ' must-see';
                    return `<span class="${cls}">${t}</span>`;
                }).join('');

                html += `
                    <div class="timeline-item" ${item.spotId !== undefined ? `onclick="openDetail(${item.spotId})"` : ''}>
                        <div class="timeline-time">${item.time}</div>
                        <div class="timeline-title">
                            <span class="emoji">${item.emoji}</span>
                            ${item.title}
                        </div>
                        <div class="timeline-desc">${item.desc}</div>
                        <div class="timeline-tags">${tagHtml}</div>
                    </div>
                `;
            });

            html += '</div></div>';
            container.innerHTML = html;
        }

        // ===== Render Spots =====
        function renderSpots() {
            const container = document.getElementById('spotsContent');
            let html = '';

            spots.forEach(spot => {
                html += `
                    <div class="spot-detail-card" onclick="openDetail(${spot.id})">
                        <div class="spot-detail-header" style="padding: 16px 20px;">
                            <h3 style="font-size: 17px; display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 24px;">${spot.emoji}</span>
                                ${spot.name}
                            </h3>
                            <p>${spot.subtitle}</p>
                        </div>
                        <div class="spot-detail-body" style="padding: 16px 20px;">
                            <div class="info-grid">
                                <div class="info-item">
                                    <div class="label">时代</div>
                                    <div class="value">${spot.era}</div>
                                </div>
                                <div class="info-item">
                                    <div class="label">门票</div>
                                    <div class="value">${spot.price}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ===== Open Detail =====
        function openDetail(id) {
            const spot = spots.find(s => s.id === id);
            if (!spot) return;
            currentDetailSpot = spot;

            let statuesHtml = '';
            if (spot.statues && spot.statues.length > 0) {
                statuesHtml = `
                    <div class="spot-section">
                        <h4>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
                            雕像与彩塑
                        </h4>
                        <div class="statue-list">
                            ${spot.statues.map(s => `
                                <div class="statue-item">
                                    <div class="emoji">${s.emoji}</div>
                                    <div class="name">${s.name}</div>
                                    <div class="desc">${s.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            const html = `
                <div class="spot-detail-header" style="position: relative;">
                    <button class="modal-close" onclick="closeModalDirect()">✕</button>
                    <h3 style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 32px;">${spot.emoji}</span>
                        ${spot.name}
                    </h3>
                    <p>${spot.subtitle}</p>
                </div>
                <div class="modal-body">
                    <div class="info-grid" style="margin-bottom: 20px;">
                        <div class="info-item">
                            <div class="label">时代</div>
                            <div class="value">${spot.era}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">门票</div>
                            <div class="value">${spot.price}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">游览时长</div>
                            <div class="value">${spot.duration}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">坐标</div>
                            <div class="value">${spot.lat.toFixed(2)}°N, ${spot.lng.toFixed(2)}°E</div>
                        </div>
                    </div>

                    <div class="spot-section">
                        <h4>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                            历史背景
                        </h4>
                        <p>${spot.history}</p>
                    </div>

                    <div class="spot-section">
                        <h4>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            建筑特色
                        </h4>
                        <p>${spot.feature}</p>
                    </div>

                    ${statuesHtml}

                    <button class="tts-btn" onclick="speakDetail()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        <span>语音讲解</span>
                    </button>

                    <button class="action-btn" onclick="navigateToSpot()" style="margin-top: 16px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                        导航前往
                    </button>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            if (e.target === document.getElementById('modalOverlay')) {
                closeModalDirect();
            }
        }

        function closeModalDirect() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
            if (isSpeaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
            }
        }

        // ===== TTS =====
        function speakDetail() {
            if (!currentDetailSpot) return;
            
            if (isSpeaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
                return;
            }

            const text = `${currentDetailSpot.name}。${currentDetailSpot.subtitle}。${currentDetailSpot.history}。${currentDetailSpot.feature}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;

            const voices = speechSynthesis.getVoices();
            const zhVoice = voices.find(v => v.lang.includes('zh'));
            if (zhVoice) utterance.voice = zhVoice;

            utterance.onend = () => { isSpeaking = false; };

            isSpeaking = true;
            speechSynthesis.speak(utterance);
        }

        // ===== Navigation =====
        function navigateToSpot() {
            if (!currentDetailSpot) return;
            const url = `https://uri.amap.com/navigation?to=${currentDetailSpot.lng},${currentDetailSpot.lat},${currentDetailSpot.name}&mode=car`;
            window.open(url, '_blank');
        }

        // ===== Location =====
        function getUserLocation() {
            const btn = document.getElementById('locationBtn');
            const text = document.getElementById('locationText');
            btn.classList.add('locating');
            text.textContent = '定位中...';

            if (!navigator.geolocation) {
                showToast('您的浏览器不支持定位功能');
                btn.classList.remove('locating');
                text.textContent = '定位';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    text.textContent = '已定位';
                    btn.classList.remove('locating');
                    showToast('定位成功！');
                    showNearbySpots();
                    if (map) {
                        map.setView([userLat, userLng], 10);
                        addUserMarker();
                    }
                },
                (err) => {
                    btn.classList.remove('locating');
                    text.textContent = '定位';
                    showToast('定位失败，已使用大同作为默认位置');
                    userLat = 40.076;
                    userLng = 113.295;
                    showNearbySpots();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        }

        function showNearbySpots() {
            if (userLat === null) return;

            document.getElementById('nearbyStatus').style.display = 'none';
            const list = document.getElementById('nearbyList');
            list.style.display = 'flex';

            const withDist = spots.map(spot => {
                const dist = getDistance(userLat, userLng, spot.lat, spot.lng);
                return { ...spot, distance: dist };
            }).sort((a, b) => a.distance - b.distance);

            list.innerHTML = '';
            withDist.forEach(spot => {
                const item = document.createElement('div');
                item.className = 'nearby-item';
                item.onclick = () => openDetail(spot.id);
                item.innerHTML = `
                    <div class="nearby-item-emoji">${spot.emoji}</div>
                    <div class="nearby-item-info">
                        <div class="nearby-item-name">${spot.name}</div>
                        <div class="nearby-item-dist">距您 ${formatDistance(spot.distance)} · ${spot.duration}</div>
                    </div>
                    <div class="nearby-item-arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function formatDistance(km) {
            if (km < 1) return Math.round(km * 1000) + '米';
            return km.toFixed(1) + '公里';
        }

        // ===== Map =====
        function initMap() {
            map = L.map('map', { zoomControl: true, attributionControl: false })
                .setView([38.5, 112.5], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

            spots.forEach(spot => {
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<span>${spot.emoji}</span>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -36]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon })
                    .addTo(map)
                    .bindPopup(`
                        <div class="popup-title">${spot.name}</div>
                        <div class="popup-desc">${spot.subtitle}</div>
                        <button class="popup-btn" onclick="openDetail(${spot.id})">查看详情</button>
                    `);

                markers.push({ marker, spot });
            });

            setTimeout(() => map.invalidateSize(), 300);
        }

        function addUserMarker() {
            if (!map || !userLat) return;
            const icon = L.divIcon({
                className: '',
                html: `<div style="width:16px;height:16px;background:#4169E1;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            L.marker([userLat, userLng], { icon }).addTo(map).bindPopup('<div class="popup-title">📍 您的位置</div>');
        }

        // ===== Toast =====
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===== Preload voices =====
        if (typeof speechSynthesis !== 'undefined') {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
    </script>
</body>
</html>

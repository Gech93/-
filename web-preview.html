<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互补数字人 - Web 预览版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 60px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 30px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        
        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 15px;
        }
        
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 40px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .feature {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .feature-title {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 50px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            margin-bottom: 30px;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        
        .instructions {
            background: #f0f4ff;
            padding: 30px;
            border-radius: 16px;
            text-align: left;
        }
        
        .instructions h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .instructions ol {
            color: #555;
            line-height: 2;
            padding-left: 25px;
        }
        
        .instructions li {
            margin: 8px 0;
        }
        
        .warning {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 12px;
            border-left: 4px solid #ffc107;
        }
        
        .warning-title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 8px;
        }
        
        .warning-text {
            color: #856404;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        
        <h1>互补数字人</h1>
        <p class="subtitle">你的专属 AI 互补伙伴，帮你从不同角度看世界</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-title">MBTI 人格测试</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤝</div>
                <div class="feature-title">互补人格算法</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💬</div>
                <div class="feature-title">智能对话</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-title">隐私保护</div>
            </div>
        </div>
        
        <a href="complement-digital-human/dist/index.html" class="cta-button">
            🚀 打开应用
        </a>
        
        <div class="instructions">
            <h3>📖 使用说明</h3>
            <ol>
                <li>点击上方「打开应用」按钮</li>
                <li>完成 16 题 MBTI 人格测试</li>
                <li>创建你的第一个互补人格</li>
                <li>开始与 AI 伙伴对话</li>
            </ol>
        </div>
        
        <div class="warning">
            <div class="warning-title">⚠️ 提示</div>
            <div class="warning-text">
                这是开发预览版本。如需在微信中使用，请下载小程序版本。
            </div>
        </div>
    </div>
</body>
</html>
